	<script charset="utf-8" src="assets/js/hq-calendar-slide-show.js"></script>
	<script>
		// スライドショーなし
		__GlovalSlideShowArray = [];
		// デフォルトパラメータ設定
		var	___PARAMETER___ = {
				background_opacity_range: 0.8,
				background_select_slide: "-",
				dark_mode: false,
				saturday_coloring: false,
		};
		if(idbnoop) {
			___PARAMETER___ = { ...___PARAMETER___, ...{
				background_slide_show_interval: 30*1000,
				country: "JP",
				latin_font: "Gravitas-One",
				japanese_font: "Kosugi-Maru",
				fest_name_hidden: true,
				holiday_name_hidden: true,
				large_time_format: "hh:mm:ss",
				monday_start: false,
				moon_hidden: true,
				schedule_name_hidden: false,
				small_time_format: "hh:mm:ss",
				tips_disp: true,
				__big_time: false,
				__calendar_column: 1,
				__calendar_row: 1,
			}};
		}
	</script>
	<script charset="utf-8" src="assets/js/hq-calendar-user-parameter.js"></script>
	<script>
		Parameter.background_opacity_range = ___PARAMETER___.background_opacity_range;
		Parameter.background_select_slide = ___PARAMETER___.background_select_slide;
		Parameter.dark_mode = ___PARAMETER___.dark_mode;
		Parameter.saturday_coloring = ___PARAMETER___.saturday_coloring;

	<!-- hq-calendar menu -->
	<link rel="stylesheet" href="assets/css/hq-calendar-menu.css" />

	<link rel="stylesheet" href="assets/css/hq-calendar-design-1.css" />
	<script charset="utf-8" src="assets/js/hq-calendar-design-1.js"></script>

	<!-- hq-calendar UI -->
	<link rel="stylesheet" href="assets/css/hq-calendar-design-1-UI-1.css" />
	<script charset="utf-8" src="assets/js/hq-calendar-design-1-UI-1.js"></script>

<style>
:root {
	--drop-shadow-color: #fff;
	--drop-shadow-background: rgba(0, 0, 0, var(--hq-calendar-background-opacity));
}
.dark-mode {
	--drop-shadow-color: #000;
	background: rgba(255, 255, 255, var(--hq-calendar-background-opacity));
}
/* 背景上のオーバーレイ（単色シート） */
.m-bkimg::before {	/*beforeは使わない*/
	content: "";
	opacity: 0;
	background: unset;
}
/* 背景上のオーバーレイ */
.m-bkimg::after {	/*[背景の透過度切換え]で白～黒を変化させる*/
	content: "";
	opacity: 1;
	background: var(--drop-shadow-background);
}

</style>


<style>
.year-title span,
.hq-clock,
.hq-clock span,
.mc1,
.mc2,
.mc3,
.week span,
.a1,
.a3 span,
.a3 .schedule-name
 {
	color: var(--drop-shadow-color) !important;
	text-shadow:
		0 1px #bbb,
		0 2px #aaa,
		0 3px #999,
		0 4px #888,
		0 5px #777,
		0 6px #666,
		0 7px #555,
		0 8px #444,
		0 9px #333,
		0 32px 24px rgba(0,0,0,0.7);
}
#.sat.week span,
#.sat .a1,
#.sat .a3 span,
#.sat .a3 .schedule-name {
	text-shadow:
		0 1px #00b,
		0 2px #00a,
		0 3px #009,
		0 4px #008,
		0 5px #007,
		0 6px #006,
		0 7px #005,
		0 8px #004,
		0 9px #003,
		0 32px 24px rgba(0,0,0,0.7);
}
#.sun.week span,
#.sun .a1,
#.sun .a3 span,
#.sun .a3 .schedule-name {
	text-shadow:
		0 1px #b00,
		0 2px #a00,
		0 3px #900,
		0 4px #800,
		0 5px #700,
		0 6px #600,
		0 7px #500,
		0 8px #400,
		0 9px #300,
		0 32px 24px rgba(0,0,0,0.7);
}
#.hq-calendar-month .m-body .cell.now .a1 {
	color: rgba(255,255,0,0.5)	!important;
	text-shadow:
		0 1px #bb0,
		0 2px #aa0,
		0 3px #990,
		0 4px #880,
		0 5px #770,
		0 6px #660,
		0 7px #550,
		0 8px #440,
		0 9px #330,
		0 32px 24px rgba(0,0,0,0.7);
}
.a3 span
 {
	text-shadow:
		0 1px #bbb,
		0 2px #aaa,
		0 3px #999,
		0 4px #888,
		0 5px #777,
		0 6px #666,
		0 7px #555,
		0 8px #444,
		0 9px #333,
		0 3px 2px rgba(0,0,0,0.7) !important;
}
.hq-calendar-month .m-body .cell.now {
	border							:	none;
	background-color				:	transparent !important;
	transition						:	all 1s;
}
.m-header .cell {
	border: var(--cell-border-width) solid #aaa !important;
	background-clip: border-box;
	box-shadow: 1px 1px 1px rgba( 255, 255, 255, 0.5);
}
</style>

</head>
<body>

	<!-- プリローダー（preloader）
    ================================================== -->
	<div id="preloader">
		<div id="loader" class="dots-fade">
			<div></div>
			<div></div>
			<div></div>
		</div>
	</div>

	<!-- カレンダー
    ================================================== -->
	<article class="hq-article">
		<section class="header-section">
			<div class="year-title">
				<span class="editable-label" data-format="YYYY | YYYY-MM"></span>
			</div>
			<div class="clock-title">
				<div class="hq-clock">
					<time class="time"></time>
					<span class="time-standard"></span>
				</div>
			</div>
		</section>
		<section class="body-section">
			<div class="hq-calendar"></div>
		</section>
	</article>

<script>
function loadEvent_04() {
	// [スライドショー]セレクトボックス非活性
	const select_slide = document.querySelector(".slide-show select");
	select_slide.disabled = true;
	// [スライドショー切替インターバル]セレクトボックス非活性
	const slide_show_interval = document.querySelector("#interval");
	slide_show_interval.disabled = true;
	// [土曜日色付け]チェック非活性
	const input_saturday_coloring = document.querySelector("#input-saturday-coloring");
	setTimeout(() => {
		input_saturday_coloring.value = !___PARAMETER___.saturday_coloring;
		input_saturday_coloring.dispatchEvent(new Event('click'));
	}, 100);
	setTimeout(() => {
		input_saturday_coloring.disabled = true;
	}, 900);
}
GlovalParameterLoadPromise.then(() => {
	window.addEventListener('load', loadEvent_04);
	if (document.readyState == "complete") {
		setTimeout(loadEvent_04, 0);
	}
});
</script>

</body></html>
