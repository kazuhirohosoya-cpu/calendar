<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Calendar Colorful Geometric Logo">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="1" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(160, 40)" filter="url(#shadow)">
    <rect x="0" y="5" width="80" height="80" rx="4" fill="#FFFFFF" />
    <rect x="0" y="5" width="80" height="18" rx="2" fill="#FFFFFF" />
    
    <path d="M5,28 L40,28 L22,55 Z" fill="#ADFF2F" />
    <path d="M40,28 L75,28 L57,45 Z" fill="#00BFFF" />
    <path d="M5,28 L22,55 L5,75 Z" fill="#800080" />
    <path d="M22,55 L57,45 L40,78 Z" fill="#FF8C00" />
    <path d="M57,45 L75,28 L75,60 Z" fill="#FF0000" />
    <path d="M40,78 L75,60 L75,80 L40,80 Z" fill="#7CFC00" />
    <path d="M5,75 L22,55 L40,78 L5,80 Z" fill="#228B22" />
    <rect x="15" y="-5" width="10" height="15" rx="2" fill="#FFD700" /><!-- 右の黄いクリップ-->
    <rect x="55" y="-5" width="10" height="15" rx="2" fill="#00BFFF" /><!-- 左の青いクリップ-->
  </g>
</svg>