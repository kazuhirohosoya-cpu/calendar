/**
 * Calculates Easter in the Gregorian/Western (Catholic and Protestant) calendar 
 * based on the algorithm by Oudin (1940) from http://www.tondering.dk/claus/cal/easter.php
 * @returns {array} [int month, int day]
 */
function getEaster(year) {
	var f = Math.floor,
		// Golden Number - 1
		G = year % 19,
		C = f(year / 100),
		// related to Epact
		H = (C - f(C / 4) - f((8 * C + 13) / 25) + 19 * G + 15) % 30,
		// number of days from 21 March to the Paschal full moon
		I = H - f(H / 28) * (1 - f(29 / (H + 1)) * f((21 - G) / 11)),
		// dayOfWeek for the Paschal full moon
		J = (year + f(year / 4) + I + 2 - C + f(C / 4)) % 7,
		// number of days from 21 March to the Sunday on or before the Paschal full moon
		L = I - J,
		month = 3 + f((L + 40) / 44),
		day = L + 28 - 31 * f(month / 4);

	return [month, day];
}
var	today = new Date();
var julian = Calendar.Julian.julianday(
			today.getFullYear(),
			today.getMonth()+1,
			today.getDate(),
			today.getHours(),
			today.getMinutes(),
			today.getSeconds(),
			today.getMilliseconds()
		);
var curDate = Calendar.Julian.caldat(julian);
// 今年のEaster
var	rtn = getEaster(curDate.year);
var	easter = Calendar.Julian.caldat(Calendar.Julian.julianday(curDate.year, rtn[0], rtn[1], 0, 0, 0, 0));
if( easter.month < curDate.month) {
	// もう過ぎたので、次のEaster
	var	rtn = getEaster(curDate.year+1);
	easter = Calendar.Julian.caldat(Calendar.Julian.julianday(curDate.year+1, rtn[0], rtn[1], 0, 0, 0, 0));
}
console.log(easter);
