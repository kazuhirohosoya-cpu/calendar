	<script>
	// 0時～23時の空の色（1時間ごとのキーカラーを定義）
	const skyColorsByHour = ["#0A0E1A", // 0:00 真夜中（限りなく黒に近い紺）
		"#0D1221", // 1:00
		"#111729", // 2:00
		"#151D33", // 3:00
		"#1B2640", // 4:00 夜明け前の濃い青
		"#2C3E5E", // 5:00 暁（少し明るいネイビー）
		"#4F6D91", // 6:00 日の出（落ち着いたブルーグレー）
		"#A5C2D9", // 7:00 早朝（淡いペールブルー）
		"#CDE4F2", // 8:00 朝（非常に薄い水色）
		"#D9EBF7", // 9:00
		"#BDE0F5", // 10:00
		"#A1D6F2", // 11:00
		"#87CEEB", // 12:00 正午（澄んだ空色）
		"#98D9F3", // 13:00
		"#A9E0F5", // 14:00
		"#BBE7F7", // 15:00
		"#CDEEF9", // 16:00
		"#D2E3EB", // 17:00 夕方前（グレーがかった薄水色）
		"#B8C9D4", // 18:00 日没（柔らかなスチールブルー）
		"#7A8C9E", // 19:00 黄昏（深みのあるブルーグレー）
		"#455A73", // 20:00 宵（夜の入り口の青）
		"#263852", // 21:00
		"#16243D", // 22:00
		"#0A0E1A" // 23:00 深夜（0時と同じ色でループ）
	];
	/**
	 * 現在の時刻に基づいて、2つのキーカラーの間を線形補間し、正確な空の色を算出する
	 * 例：6:30 なら 6時の色と7時の色を50%ずつ混ぜる
	 * @param {Date} datetime - 取得したい時刻
	 * @returns {string} rgb(r, g, b) 形式の文字列
	 */
	function getInterpolatedSkyColor(datetime) {
		// 現在の時・分・秒を取得
		const hour = datetime.getHours();
		const min = datetime.getMinutes();
		const sec = datetime.getSeconds();
		// 1. 現在の「時」と、遷移先となる「次の時」を決定（23時の次は0時に戻る）
		const nextHour = (hour + 1) % 24;
		// 2. 現在の時から次の時まで、どのくらい時間が経過したか（0.0 〜 1.0）を算出
		// 1時間（3600秒）を分母として、現在の「秒」の進捗を計算
		const progress = (min * 60 + sec) / 3600;
		// 3. 配列からHEXカラーを取得し、計算可能なRGB形式に変換
		const color1 = hexToRgb(skyColorsByHour[hour]);
		const color2 = hexToRgb(skyColorsByHour[nextHour]);
		// 4. 線形補間（Lerp）による色の混合
		// 式: 開始色 + (終了色 - 開始色) * 進捗率
		const r = Math.round(color1.r + (color2.r - color1.r) * progress);
		const g = Math.round(color1.g + (color2.g - color1.g) * progress);
		const b = Math.round(color1.b + (color2.b - color1.b) * progress);
		// CanvasやCSSでそのまま使える形式で返す
		return `rgb(${r}, ${g}, ${b})`;
	}
	/**
	 * HEX形式のカラーコード（#RRGGBB）をRGB数値オブジェクトに変換する
	 * @param {string} hex - "#0A0E1A" 等の文字列
	 * @returns {object|null} {r, g, b} または 変換失敗時は null
	 */
	function hexToRgb(hex) {
		// 正規表現で2桁ずつ分解してキャプチャ
		const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
		return result ? {
			r: parseInt(result[1], 16), // 16進数を10進数に変換
			g: parseInt(result[2], 16),
			b: parseInt(result[3], 16)
		} : null; // 不正なHEXの場合は null
	}

		 *	const now = new Date(); // UTC時刻として扱われる
		 *	// ワシントンD.C. (西経はマイナスで入力)
		 *	console.log("Washington D.C.:", calc.calculate(now, 38.9072, -77.0369));
		 *	// ロンドン
		 *	console.log("London:", calc.calculate(now, 51.5074, -0.1278));
		 *	// 東京
		 *	console.log("Tokyo:", calc.calculate(now, 35.6895, 139.6917));
		 */
		calculate(date, lat, lon, height = 0) {
			const jd = this.#getJulianDay(date);
			const t = (jd - 2451545.0) / 36525; // ユリウス世紀 [7, 8]
			// 1. 太陽の計算 (Meeus Ch.25) [9, 10]
			const sunPos = this.#getSunPosition(t);
			// 2. 月の計算 (Meeus Ch.47 / ELP2000-82B 簡略版) [11, 12]
			const moonPos = this.#getMoonPosition(t);
			// 3. 共通補正（恒星時・章動） [13, 14]
			const gmst = this.#getGMST(jd, t);
			const lst = (gmst + lon) % 360; // 地方恒星時。経度符号の統一が重要 [4, 15]
			// 4. 水平座標への変換とトップセントリック補正（視差・屈折）
			const sunHz = this.#toHorizontal(sunPos, lat, lst, false);
			const moonHz = this.#toHorizontal(moonPos, lat, lst, true, height);
			return {
				sun: {
					altitude: sunHz.alt,
					azimuth: sunHz.az
				},
				moon: {
					altitude: moonHz.alt,
					azimuth: moonHz.az,
					distance: moonPos.dist
				}
			};
		}
		#getJulianDay(date) {
			return (date.getTime() / 86400000) + 2440587.5; // UTCベースのユリウス日 [16, 17]
		}
		#getGMST(jd, t) {
			// グリニッジ平均恒星時 (degrees) 
			let gmst = 280.46061837 + 360.98564736629 * (jd - 2451545.0) + 0.000387933 * t * t;
			return (gmst % 360 + 360) % 360;
		}
		#getSunPosition(t) {
			// 太陽の平均要素 
			const L0 = 280.46646 + 36000.76983 * t + 0.0003032 * t * t;
			const M = 357.52911 + 35999.05029 * t - 0.0001559 * t * t;
			const C = (1.914602 - 0.004817 * t) * Math.sin(M * this.RAD) + 0.019993 * Math.sin(2 * M * this.RAD);
			const lon = L0 + C; // 真黄経 [9, 18]
			const eps = 23.43929 - 0.013004 * t; // 黄道傾斜角 
			const ra = Math.atan2(Math.cos(eps * this.RAD) * Math.sin(lon * this.RAD), Math.cos(lon * this.RAD)) * this.DEG;
			const dec = Math.asin(Math.sin(eps * this.RAD) * Math.sin(lon * this.RAD)) * this.DEG;
			return {
				ra: (ra % 360 + 360) % 360,
				dec: dec,
				dist: 1.0,
				parallax: 0.0024
			};
		}
		#getMoonPosition(t) {
			// 月の基本引数 (Delaunay arguments) [11, 12]
			const L = (218.3164477 + 481267.88123421 * t) % 360; // 平均黄経
			const D = (297.8501921 + 445267.1114034 * t) % 360; // 平均離角
			const M = (357.5291092 + 35999.0502909 * t) % 360; // 太陽平均近点離角
			const Mp = (134.9633964 + 477198.8675055 * t) % 360; // 月平均近点離角
			const F = (93.2720950 + 483202.0175233 * t) % 360; // 緯度引数
			// 主要な摂動項の計算（イベクション、バリエーション等） 
			let dLon = 6.288774 * Math.sin(Mp * this.RAD) + 1.274027 * Math.sin((2 * D - Mp) * this.RAD) + 0.658314 * Math.sin(2 * D * this.RAD);
			let dLat = 5.128122 * Math.sin(F * this.RAD) + 0.280602 * Math.sin((Mp + F) * this.RAD);
			let dist = 385000.56 - 20905.355 * Math.cos(Mp * this.RAD); // 距離(km) 
			const lon = L + dLon;
			const lat = dLat;
			const eps = 23.43929 - 0.013004 * t;
			// 赤道座標への変換
			const ra = Math.atan2(Math.sin(lon * this.RAD) * Math.cos(eps * this.RAD) - Math.tan(lat * this.RAD) * Math.sin(eps * this.RAD), Math.cos(lon * this.RAD)) * this.DEG;
			const dec = Math.asin(Math.sin(lat * this.RAD) * Math.cos(eps * this.RAD) + Math.cos(lat * this.RAD) * Math.sin(eps * this.RAD) * Math.sin(lon * this.RAD)) * this.DEG;
			const pi = Math.asin(6378.14 / dist) * this.DEG; // 地平視差 [5, 19]
			return {
				ra: (ra % 360 + 360) % 360,
				dec: dec,
				dist: dist,
				parallax: pi
			};
		}
		#toHorizontal(pos, lat, lst, isMoon, height = 0) {
			let H = (lst - pos.ra); // 時角 [20, 6]
			let ra = pos.ra; // ← 元の RA を保持
			let dec = pos.dec;
			// トップセントリック視差補正（ロンドン・ワシントンでの誤差解消に必須） 
			if (isMoon) {
				const u = Math.atan(0.996647 * Math.tan(lat * this.RAD));
				const rhoSin = 0.996647 * Math.sin(u) + (height / 6378140) * Math.sin(lat * this.RAD);
				const rhoCos = Math.cos(u) + (height / 6378140) * Math.cos(lat * this.RAD);
				const pi = pos.parallax * this.RAD;
				// ΔRA
				const deltaRa = Math.atan2(-rhoCos * Math.sin(pi) * Math.sin(H * this.RAD), Math.cos(pos.dec * this.RAD) - rhoCos * Math.sin(pi) * Math.cos(H * this.RAD));
				// ΔDec（あなたのコードには無い）
				const deltaDec = Math.atan2(
					(Math.sin(pos.dec * this.RAD) - rhoSin * Math.sin(pi)) * Math.cos(deltaRa), Math.cos(pos.dec * this.RAD) - rhoCos * Math.sin(pi) * Math.cos(H * this.RAD)) - pos.dec * this.RAD;
				// 補正後の RA/Dec
				const ra = pos.ra + deltaRa * this.DEG;
				const dec = pos.dec + deltaDec * this.DEG;
				H = lst - ra;
			}
			// 高度と方位の算出 [16, 20, 19]
			const alt = Math.asin(Math.sin(lat * this.RAD) * Math.sin(dec * this.RAD) + Math.cos(lat * this.RAD) * Math.cos(dec * this.RAD) * Math.cos(H * this.RAD)) * this.DEG;
			let az = Math.atan2(-Math.sin(H * this.RAD), Math.cos(lat * this.RAD) * Math.tan(dec * this.RAD) - Math.sin(lat * this.RAD) * Math.cos(H * this.RAD)) * this.DEG;
			// 方位角の正規化（北=0, 東=90） 
			az = (az % 360 + 360) % 360;
			// 大気屈折補正 (Sæmundssonの式) 
			let altCorr = alt;
			if (altCorr > -0.5) {
				const R = 1.02 / Math.tan((altCorr + 10.3 / (altCorr + 5.11)) * this.RAD);
				altCorr += R / 60;
			}
			return {
				alt: altCorr,
				az
			};
		}
	}
	</script>

	<script>
	function formatDateTime(dateObj, formatStr) {
		/**
		 * 数値を指定の桁数でゼロ埋めする内部関数
		 * @param {number} num - 対象の数値
		 * @param {number} length - 桁数
		 * @returns {string}
		 */
		const pad = (num, length, ch = '0') => String(num).padStart(length, ch);

		// フォーマット内の各トークンを置換していく
		return formatStr.replace(/YYYY|MM|#M|M|DD|#D|D|hh|#h|h|mm|#m|m|ss|#s|s|SSS/g, (token) => {
			switch (token) {
				case "YYYY":
					return String(dateObj.year);
				case "MM":
					return pad(dateObj.month, 2);
				case "#M":
					return pad(dateObj.month, 2, ' ');
				case "M":
					return String(dateObj.month);
				case "DD":
					return pad(dateObj.day, 2);
				case "#D":
					return pad(dateObj.day, 2, ' ');
				case "D":
					return String(dateObj.day);
				case "hh":
					return pad(dateObj.hour, 2);
				case "#h":
					return pad(dateObj.hour, 2, ' ');
				case "h":
					return String(dateObj.hour);
				case "mm":
					return pad(dateObj.minute, 2);
				case "#m":
					return pad(dateObj.minute, 2, ' ');
				case "m":
					return String(dateObj.minute);
				case "ss":
					return pad(dateObj.second, 2);
				case "#s":
					return pad(dateObj.second, 2, ' ');
				case "s":
					return String(dateObj.second);
				case "SSS":
					return pad(dateObj.millisecond, 3);
				default:
					return token;
			}
		});
	}
	function format(datetime, formatStr) {
		return formatDateTime({
				year: datetime.getFullYear(),
				month: datetime.getMonth() + 1,
				day: datetime.getDate(),
				hour: datetime.getHours(),
				minute: datetime.getMinutes(),
				second: datetime.getSeconds(),
				millisecond: datetime.getMilliseconds(),
				dayOfWeek: datetime.getDay()
			}, formatStr);
	}

	</script>

	function draw(datetime, latlngs, skyColor) {

		// 1. 空の描画
		if(! skyColor) {
			let dt = new Date(datetime);
			dt.setMinutes(dt.getMinutes() + dt.getTimezoneOffset());
			dt.setMinutes(dt.getMinutes() + latlngs.utcOffset);
			skyColor = gEngine.context.createLinearGradient(0, 0, 0, horizonY);
			if (dt.getHours() >= 5 && dt.getHours() <= 19) {
				if (dt.getHours() < 7 || dt.getHours() > 17) {
					skyColor.addColorStop(0, "#0c1445");
					skyColor.addColorStop(0.7, "#fb8c00");
					skyColor.addColorStop(1, "#ffcc80");
				} else {
					skyColor.addColorStop(0, "#4faeff");
					skyColor.addColorStop(1, "#cde9ff");
				}
			} else {
				skyColor.addColorStop(0, "#010408");
				skyColor.addColorStop(1, "#0a1220");
			}
		}
		gEngine.gspace.backgroundColor = skyColor;

		gEngine.clear();
		// 軌跡の描画関数
		function drawOrbit(calcFunc, color) {
			let orbit = [];
			for (let h = 0; h <= 24; h += 1/6) {
				const tempDate = new Date(datetime);
				tempDate.setMinutes(0, 0);
				tempDate.setTime(tempDate.getTime() + h * 3600000);
				const p = calcFunc(tempDate, latlngs.lat, latlngs.lng);
				if (p.altitude > AxisY[1]) { // 地平線より少し下まで描画
					orbit.push([p.azimuth, p.altitude]);
				}
			}
			orbit.push([orbit[0][0],orbit[0][1]]);
			orbit.forEach((c, i) => {
				if (i > 0) {
					gEngine.push(new Gpath({
						vertices: [
							[orbit[i - 1], orbit[i]]
						],
						lineWidth: 0.5,
						strokeColor: color,
					}));
				}
			});
		}
		drawOrbit((dt, lat, lng) => AstroCalc.calculate(dt, lat, lng).sun, "rgba(230, 126, 34, 0.4)");
	//	drawOrbit((dt, lat, lng) => AstroCalc.calculate(dt, lat, lng).moon, "rgba(236, 240, 241, 0.4)");
		let	Pos = AstroCalc.calculate(datetime, latlngs.lat, latlngs.lng);
		let sunPos = Pos.sun;
		let moonPos = Pos.moon;
		// 太陽の描画
		if (sunPos.altitude > 0) {
			gEngine.push(new Gpath({
				vertices: Gshape.oval(null, SunSz[0], SunSz[1], 0, Math.PI * 2),
				fillColor: "#ffff55",
				shadow: {
					color: "yellow",
					blur: 15,
				},
				translate: [sunPos.azimuth, sunPos.altitude],
			}));
		}
		// 月の描画
		var minmax = {min: 364095.20500000246, max: 405905.9149999965, minSz: 10, maxSz: 40};
		const mnSz = minmax.maxSz - (moonPos.distance - minmax.min) / (minmax.max - minmax.min) * (minmax.maxSz - minmax.minSz);
		const MoonSz = gEngine.gspace.screenToWorldSize([mnSz, mnSz]);
		if (moonPos.altitude > 0) {
			gEngine.push(new Gpath({
				vertices: Gshape.moonoval(MoonSz[0], MoonSz[1], Gshape.moonPhaseCalc(datetime.getFullYear(), datetime.getMonth() + 1, datetime.getDate())),
				fillColor: "#fff",
				shadow: {
					color: "#feeede",
					blur: 20,
				},
				translate: [moonPos.azimuth, moonPos.altitude],
			}));
		}
		// 地面
		gEngine.push(new Gpath({
			vertices: [
				[AxisX[0], AxisY[1]],
				[AxisX[0], AxisY[0] - screend[1] * 0.9],
				[AxisX[1], AxisY[0] - screend[1] * 0.9],
				[AxisX[1], AxisY[1]]
			],
			fillColor: "#1a252f",
		}));
		gEngine.run();
	}

<script>

	function update() {

		// 地域 緯度・経度
		let	area_id = "JP";

		LATLNGS.name = cd.name;

	//	dt.setMinutes(dt.getMinutes() + LATLNGS.utcOffset);

		document.querySelector('#result').innerText = `
			${format(dt, "YYYY年#M月#D日 #h時mm分ss秒")}
			${LATLNGS.display_name}
			緯度:${LATLNGS.lat}　経度:${LATLNGS.lng}
		`.trim();

		// 空の色（＝背景色）を算出
		let skyColor = getInterpolatedSkyColor(dt);

		// 背景の太陽・月の起動を描画
		var datetime = new Date(Parameter_calendar_Now);
	//	datetime.setFullYear(Parameter.calendar.year);
	//	datetime.setMonth(Parameter.calendar.month - 1);
		draw(datetime, LATLNGS, skyColor);
	}

	var Parameter_calendar_Now = new Date();
	var LATLNGS = {};

	var gEngine = new Gengine(document.getElementById("skyCanvas"));
	gEngine.gspace = new __GworldSpace();
	const azimuth_deviation = 120;
	const AxisX = [180-azimuth_deviation, 180+azimuth_deviation];
	const AxisY = [90, -5];	//[80, -5]
	gEngine.setSpace({
		world_axis_x: AxisX,
		world_axis_y: AxisY,
		foregroundColor: "#777",
		backgroundColor: "rgba(238, 238, 238, 0.2)",
	});
	const horizonY = gEngine.gspace.screenHeight;
	const screend = gEngine.gspace.screenToWorldSize([gEngine.gspace.screenWidth, gEngine.gspace.screenHeight]);
	const horizonYd = (AxisY[0] - AxisY[1]) * 0.95;
	const SunSz = gEngine.gspace.screenToWorldSize([40, 40]);
	const AstroCalc = new AstroCalculator();

	//-----------------------------------------------------
	// 1. キーボードイベント (ArrowKeys)
	//-----------------------------------------------------
	window.addEventListener('keydown', (e) => {
		switch (e.key) {
			// 左右キーで時間を増減 (Hours)
			case 'ArrowLeft':
				Parameter_calendar_Now.setMinutes(Parameter_calendar_Now.getMinutes() - 10);
				break;
			case 'ArrowRight':
				Parameter_calendar_Now.setMinutes(Parameter_calendar_Now.getMinutes() + 10);
				break;
				// 上下キーで日付を増減 (Date)
			case 'ArrowUp':
				if (e.ctrlKey) {
					LATLNGS.lat += 1;
					if (LATLNGS.lat > 90) LATLNGS.lat = -90;
				} else if (e.shiftKey) {
					LATLNGS.lng += 1;
					if (LATLNGS.lng > 360) LATLNGS.lng = 0;
				} else {
					Parameter_calendar_Now.setDate(Parameter_calendar_Now.getDate() + 1);
				}
				break;
			case 'ArrowDown':
				if (e.ctrlKey) {
					LATLNGS.lat -= 1;
					if (LATLNGS.lat < -90) LATLNGS.lat = 90;
				} else if (e.shiftKey) {
					LATLNGS.lng -= 1;
					if (LATLNGS.lng < 0) LATLNGS.lng = 360;
				} else {
					Parameter_calendar_Now.setDate(Parameter_calendar_Now.getDate() - 1);
				}
				break;
			default:
				return; // 対象外のキーは無視
		}
		if (typeof update === 'function') update();
	});

	//-----------------------------------------------------
	// 4. 10分間隔で再描画
	//-----------------------------------------------------
	const tenM = 10*60*1000;
	function updateWrap() {
		update();
		let cur = (new Date()).getTime();
		setTimeout(updateWrap, tenM - cur%tenM);
	}
	setTimeout(updateWrap, 100);

</script>

<script>
	/**
	 * 入力された住所を緯度・経度に変換（ジオコーディング）する
	 */
	async function geocode(addr) {
		// 住所が空の場合は処理を中断（必要に応じて追加）
		if (!addr) return;
		let cd = Coordinates.find(e => e.id == addr);
		if(cd) {
			LATLNGS.name = cd.name;
			LATLNGS.display_name = cd.name;
			LATLNGS.lat = parseFloat(cd.latitude);
			LATLNGS.lng = parseFloat(cd.longitude);
			LATLNGS.utcOffset = cd.utcOffset;
			update();
			return;
		}
		try {
			// 2. OpenStreetMapのNominatim APIへリクエストを送信
			// encodeURIComponent で住所をURL安全な形式にエンコードし、JSON形式で結果を要求
			const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addr)}`);
			// 3. レスポンスをJSONとして解析
			const data = await res.json();
			/*
			 *	[
			 *		{
			 *			"place_id": 240186094,
			 *			"licence": "Data © OpenStreetMap contributors, ODbL 1.0. http://osm.org/copyright",
			 *			"osm_type": "relation",
			 *			"osm_id": 4135014,
			 *			"lat": "38.2677554",
			 *			"lon": "140.8691498",
			 *			"class": "boundary",
			 *			"type": "administrative",
			 *			"place_rank": 16,
			 *			"importance": 0.6503932217539525,
			 *			"addresstype": "city",
			 *			"name": "仙台市",
			 *			"display_name": "仙台市, 宮城県, 日本",
			 *			"boundingbox": [
			 *				"38.0508487",
			 *				"38.4546990",
			 *				"140.4694720",
			 *				"141.2603046"
			 *			]
			 *		}
			 *	]
			 */
			// 4. 検索結果が見つかった場合の処理
			if (data.length > 0) {
				// 最も一致度の高い最初のデータ（data[0]）から緯度・経度を抽出
				// APIの戻り値は文字列なので、parseFloatで数値に変換
				LATLNGS.name = data[0].name;
				LATLNGS.display_name = data[0].display_name;
				LATLNGS.lat = parseFloat(data[0].lat);
				LATLNGS.lng = parseFloat(data[0].lon);
				// 5. 座標が更新されたので、シミュレーターの描画などを更新
				update();
			} else {
				// 検索結果が空（住所が特定できなかった）場合
				alert("場所が見つかりませんでした。");
			}
		} catch (error) {
			// ネットワークエラーやAPI側の不具合が発生した場合のハンドリング
			console.error("ジオコーディング中にエラーが発生しました:", error);
		}
	}

</script>
